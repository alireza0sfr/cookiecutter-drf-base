[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.repo_name }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }
]
license = { text = "MIT" }
dependencies = [
    # Core Django
    "Django==6.0.7",
    "asgiref==3.12.1",

    # Django REST Framework
    "djangorestframework==3.17.1",
    "drf-spectacular==0.30.0",
    "djangorestframework-camel-case==1.4.2",
    "djangorestframework-simplejwt==5.5.1",

    # Django Admin & UI
    "django-unfold==0.102.0",
    "django-jalali-date==1.1.0",

    # Django Extensions
    "django-cors-headers==4.4.0",
    "django-filter==26.1",
    "django-lifecycle==1.2.4",
    "django-environ==0.11.2",

    # Database
    "psycopg2-binary>=2.9.10",

    # Caching & Messaging
    "redis==5.0.4",
    "celery==5.6.3",

    # Utilities
    "requests==2.32.0",
    "pillow>=11.0.0",
    "pytz==2024.1",
    "inflection==0.5.1",
    "packaging==24.1",
    "PyYAML==6.0.1",
    "typing_extensions==4.12.2",
    "uritemplate==4.1.1",
    "urllib3==2.2.3",
    "sqlparse==0.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/{{ cookiecutter.repo_name }}"
Repository = "https://github.com/yourusername/{{ cookiecutter.repo_name }}.git"
Documentation = "https://github.com/yourusername/{{ cookiecutter.repo_name }}/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.1",
    "ruff>=0.4.7",
    "ipython>=8.27.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-django>=4.5.0",
    "factory-boy>=3.2.0",
    "faker>=15.0.0",
    "django-debug-toolbar>=4.0.0",
    "django-extensions>=3.2.0",
]
sms = [
    "kavenegar>=1.1.2",
]
apm = [
    "elastic-apm>=6.23.0",
]

[tool.setuptools]
packages = ["{{ cookiecutter.__project_slug }}", "apps", "core"]

[tool.ruff]
# Python version this project targets
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E203",   # whitespace before :
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.__project_slug }}", "apps", "core"]
known-django = ["django"]

[tool.ruff.lint.flake8-django]
django-settings-module = "{{ cookiecutter.__project_slug }}.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "{{ cookiecutter.__project_slug }}.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --cov=apps --cov=core --cov-report=html --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests", "apps"]

[tool.coverage.run]
source = ["apps", "core"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.django-stubs]
django_settings_module = "{{ cookiecutter.__project_slug }}.settings"
