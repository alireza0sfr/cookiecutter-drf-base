apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aghamohandes-ingress
  namespace: default
  labels:
    app: aghamohandes
  annotations:
    # Nginx Ingress Controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'";

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://frontend.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # Proxy settings
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Rewrite rules (if needed)
    nginx.ingress.kubernetes.io/rewrite-target: /

    # For cert-manager (Let's Encrypt)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - api.example.com
    secretName: aghamohandes-tls-cert

  rules:
  - host: api.example.com
    http:
      paths:
      # Static files
      - path: /static/
        pathType: Prefix
        backend:
          service:
            name: aghamohandes-static
            port:
              number: 80

      # Media files
      - path: /media/
        pathType: Prefix
        backend:
          service:
            name: aghamohandes-media
            port:
              number: 80

      # Django application
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aghamohandes-web
            port:
              number: 8000

---
# Certificate Issuer for Let's Encrypt (requires cert-manager)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Alternative: Self-signed certificate for staging
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}

---
# Ingress for staging with self-signed cert
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aghamohandes-ingress-staging
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "selfsigned"
spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - staging.example.com
    secretName: aghamohandes-staging-tls-cert

  rules:
  - host: staging.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aghamohandes-web
            port:
              number: 8000
