apiVersion: v1
kind: ServiceAccount
metadata:
  name: aghamohandes
  namespace: default
  labels:
    app: aghamohandes

---
# Role for pod operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aghamohandes
  namespace: default
  labels:
    app: aghamohandes
rules:
# Read pods for debugging
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# Read pod logs
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

# Read ConfigMaps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]

# Read Secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aghamohandes
  namespace: default
  labels:
    app: aghamohandes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aghamohandes
subjects:
- kind: ServiceAccount
  name: aghamohandes
  namespace: default

---
# ClusterRole for cross-namespace access (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aghamohandes-cluster
  labels:
    app: aghamohandes
rules:
# Read nodes (for node affinity)
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

# Read namespaces
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aghamohandes
  labels:
    app: aghamohandes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aghamohandes-cluster
subjects:
- kind: ServiceAccount
  name: aghamohandes
  namespace: default
