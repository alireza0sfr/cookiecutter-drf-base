apiVersion: v1
kind: Service
metadata:
  name: aghamohandes-web
  namespace: default
  labels:
    app: aghamohandes
    component: web
spec:
  type: ClusterIP
  selector:
    app: aghamohandes
    component: web
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None

---
# Headless service for StatefulSets (if needed)
apiVersion: v1
kind: Service
metadata:
  name: aghamohandes-web-headless
  namespace: default
  labels:
    app: aghamohandes
    component: web
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: aghamohandes
    component: web
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP

---
# External LoadBalancer service (if using cloud provider)
apiVersion: v1
kind: Service
metadata:
  name: aghamohandes-web-lb
  namespace: default
  labels:
    app: aghamohandes
    component: web
  annotations:
    # AWS
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
    # GCP
    cloud.google.com/neg: '{"ingress": true}'
    # Azure
    service.beta.kubernetes.io/azure-load-balancer-internal: 'false'
spec:
  type: LoadBalancer
  selector:
    app: aghamohandes
    component: web
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
