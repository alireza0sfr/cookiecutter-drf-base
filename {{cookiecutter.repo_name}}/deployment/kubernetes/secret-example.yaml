# WARNING: This is an EXAMPLE template. Never commit actual secrets to git!
# Instead, use one of these approaches:
# 1. Use Kubernetes Secret management tools (Sealed Secrets, External Secrets)
# 2. Use your cloud provider's secret management (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault)
# 3. Use Helm with values files and --values flags (not checked into git)
# 4. Use kubectl create secret from environment variables or files

apiVersion: v1
kind: Secret
metadata:
  name: aghamohandes-secrets
  namespace: default
  labels:
    app: aghamohandes
type: Opaque
stringData:
  # Database credentials
  database-url: "postgresql://postgres:CHANGE_ME@postgres:5432/aghamohandes"
  postgres-password: "CHANGE_ME"
  postgres-user: "postgres"

  # Redis
  redis-password: "CHANGE_ME"

  # Django
  secret-key: "CHANGE_ME_VERY_LONG_RANDOM_SECRET_KEY"

  # Email settings
  email-host: "smtp.example.com"
  email-host-user: "noreply@example.com"
  email-host-password: "CHANGE_ME"

  # Optional: Sentry DSN for error tracking
  sentry-dsn: "https://CHANGE_ME@sentry.example.com/PROJECT_ID"

---
# Example: Using Sealed Secrets (recommended for GitOps)
# Install: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
# Usage: echo -n 'mypassword' | kubectl create secret generic mysecret --dry-run=client --from-file=password=/dev/stdin -o yaml | kubeseal -f -

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: aghamohandes-secrets-sealed
  namespace: default
spec:
  encryptedData:
    database-url: AgBvZ... # sealed encrypted value
    secret-key: AgDmK... # sealed encrypted value
  template:
    metadata:
      name: aghamohandes-secrets
      namespace: default
    type: Opaque

---
# Instructions for creating secrets securely:

# Option 1: Using kubectl (one-time setup)
# kubectl create secret generic aghamohandes-secrets \
#   --from-literal=database-url="postgresql://postgres:PASSWORD@postgres:5432/aghamohandes" \
#   --from-literal=secret-key="YOUR_LONG_RANDOM_SECRET_KEY" \
#   --from-literal=redis-password="REDIS_PASSWORD" \
#   --from-literal=email-host-password="EMAIL_PASSWORD"

# Option 2: Using environment file
# cat > .env.secret
# DATABASE_URL=postgresql://...
# SECRET_KEY=...
# EOF
# kubectl create secret generic aghamohandes-secrets --from-env-file=.env.secret

# Option 3: Using External Secrets Operator
# Install: helm repo add external-secrets https://charts.external-secrets.io
#          helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace

# Option 4: Using AWS Secrets Manager
# eksctl utils enable-logging --cluster=MY_CLUSTER --log-types=all
# aws secretsmanager create-secret --name aghamohandes/db --secret-string='{"username":"postgres","password":"CHANGE_ME"}'
# Then use External Secrets or IAM policies to access them

# Option 5: Using Hashicorp Vault
# Install: helm repo add hashicorp https://helm.releases.hashicorp.com
#          helm install vault hashicorp/vault -n vault --create-namespace

# Never use base64 encoding as a security measure - it's only encoding, not encryption!
