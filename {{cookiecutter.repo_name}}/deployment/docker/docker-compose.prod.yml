# Docker Compose for Production Environment
# Usage: docker-compose -f docker-compose.prod.yml up -d
# IMPORTANT: Use environment variables for sensitive data (.env file)

version: '3.9'

services:
  # ========================================================================
  # PostgreSQL Database (Production)
  # ========================================================================
  db:
    image: postgres:14-alpine
    container_name: aghamohandes-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aghamohandes}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: -c shared_buffers=256MB -c max_connections=200
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aghamohandes-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================================
  # Redis Cache & Message Broker (Production)
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: aghamohandes-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only localhost access
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aghamohandes-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================================
  # Django Web Application (Production)
  # ========================================================================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: aghamohandes-web-prod
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECURE_SSL_REDIRECT: "true"
      SESSION_COOKIE_SECURE: "true"
      CSRF_COOKIE_SECURE: "true"
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: "true"
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - media_prod:/app/media
      - static_prod:/app/static
      - logs_prod:/app/logs
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aghamohandes-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================================================
  # Celery Worker (Production)
  # ========================================================================
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: aghamohandes-celery-prod
    command: celery -A aghamohandes_backend worker -l info --concurrency=4
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - logs_prod:/app/logs
    depends_on:
      - db
      - redis
      - web
    networks:
      - aghamohandes-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================================
  # Celery Beat (Task Scheduler - Production)
  # ========================================================================
  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: aghamohandes-beat-prod
    command: celery -A aghamohandes_backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: "false"
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - logs_prod:/app/logs
    depends_on:
      - db
      - redis
      - web
    networks:
      - aghamohandes-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================================
  # Nginx Reverse Proxy (Production)
  # ========================================================================
  nginx:
    image: nginx:alpine
    container_name: aghamohandes-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/:/etc/nginx/ssl:ro
      - static_prod:/app/static:ro
      - media_prod:/app/media:ro
      - logs_prod:/var/log/nginx
    depends_on:
      - web
    networks:
      - aghamohandes-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  media_prod:
    driver: local
  static_prod:
    driver: local
  logs_prod:
    driver: local

networks:
  aghamohandes-prod:
    driver: bridge
